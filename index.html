<!doctype html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Desk Meetings</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} body{margin:0;background:#0b0d12;color:#f4f6fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;overflow:hidden}button,input{font:inherit}button{cursor:pointer}
.app{height:100vh;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;padding:14px 16px 12px}.top{height:72px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between}.weeknav{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}.weeknav>*{margin-right:12px}.nav{width:42px;height:42px;border:1px solid #2a2f3a;background:#151922;color:#fff;border-radius:12px;font-size:24px}.listbtn{position:absolute;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);top:29px;height:42px;border:1px solid #343b49;background:#202632;color:#fff;border-radius:12px;padding:0 14px;font-weight:700;margin-right:12px}.weektitle{font-size:24px;font-weight:700}.version{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;color:#727b8d;vertical-align:middle}.sub{font-size:13px;color:#8f98aa;margin-top:3px}.clock{text-align:right;min-width:270px}.time{font-size:72px;line-height:66px;font-weight:700;letter-spacing:-3px}.date{color:#8f98aa;font-size:13px}
.grid{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;min-height:0}.day{-webkit-flex:1;flex:1;margin-right:10px;background:#11151d;border:1px solid #242a35;border-radius:16px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;overflow:hidden;position:relative;min-width:0}.day:last-child{margin-right:0}.day.today{border-color:#7c5cff;box-shadow:inset 0 0 0 1px #7c5cff}.dayhead{padding:13px 12px 10px;border-bottom:1px solid #222834}.dow{font-size:13px;color:#a5adbd;text-transform:uppercase;letter-spacing:.8px;font-weight:700}.dnum{font-size:26px;font-weight:700;margin-top:1px}.today .dnum{color:#a895ff}.events{padding:10px;overflow:hidden;-webkit-flex:1;flex:1;position:relative}.event{position:absolute;left:10px;right:10px;background:#1b202b;border-left:4px solid #7c5cff;border-radius:10px;padding:9px;min-height:38px}.event.past{opacity:.38}.etime{font-size:16px;font-weight:700}.ename{font-size:21px;font-weight:700;line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.add{position:absolute;right:10px;top:10px;width:34px;height:34px;border:1px solid #3b4352;border-radius:10px;background:#1b202b;color:#c8cfda;font-size:22px;line-height:32px;padding:0;text-align:center}.soundbar{height:44px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}.soundbtn{border:1px solid #343b49;background:#202632;color:#fff;border-radius:10px;padding:7px 14px;font-size:12px}.soundbtn.on{border-color:#62c98c;color:#86e5aa}.foot{height:30px;display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;-webkit-justify-content:center;justify-content:center;color:#626b7c;font-size:12px}
.modal{display:none;position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.72);-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:-webkit-flex;display:flex}.card{width:360px;max-width:100%;background:#171b24;border:1px solid #303746;border-radius:18px;padding:18px}.card h2{margin:0 0 15px;font-size:21px}.field{margin:11px 0}.field label{display:block;color:#9ba4b5;font-size:12px;margin-bottom:5px}.field input{width:100%;height:43px;background:#0e1118;border:1px solid #303746;border-radius:10px;color:#fff;padding:0 11px}.actions{display:-webkit-flex;display:flex;margin-top:16px}.actions button{-webkit-flex:1;flex:1;height:42px;border-radius:10px;border:1px solid #343b49;background:#202632;color:#fff;margin-right:8px}.actions button:last-child{margin-right:0}.actions .save{background:#7c5cff;border-color:#7c5cff;font-weight:700}.delete{margin-top:9px;width:100%;height:38px;border:0;background:transparent;color:#e47777}.future{display:none;position:fixed;left:0;right:0;top:0;bottom:0;background:#0b0d12;z-index:4;padding:18px;overflow:auto}.future.show{display:block}.futuretop{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;margin-bottom:16px}.futuretop h1{margin:0;font-size:28px}.futureactions button{height:40px;border:1px solid #343b49;background:#202632;color:#fff;border-radius:10px;padding:0 14px;margin-left:8px;font-weight:700}.futureactions .futureadd{background:#7c5cff;border-color:#7c5cff}.futureitem{background:#151922;border:1px solid #2a2f3a;border-radius:12px;padding:13px 15px;margin-bottom:9px}.futurewhen{font-size:13px;color:#9ba4b5;margin-bottom:3px}.futurename{font-size:20px;font-weight:700}.emptyfuture{color:#8f98aa;text-align:center;padding:50px 0}.alarm{display:none;position:fixed;left:0;right:0;top:0;bottom:0;background:#6c4cff;color:#fff;z-index:10;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center}.alarm.show{display:-webkit-flex;display:flex}.alarm .big{font-size:20px}.alarm h1{font-size:48px;margin:8px 0}.alarm button{margin-top:25px;padding:12px 28px;border:0;border-radius:12px;font-weight:700}
</style></head><body>
<div class='app'><div class='top'><div class='weeknav'><button class='nav' id='prev'>‹</button><div><div class='weektitle'><span id='weektitle'>This week</span><span class='version'>v6</span></div><div class='sub'>Tuesday — Friday</div></div><button class='nav' id='next'>›</button></div><button class='listbtn' id='listbtn'>All meetings</button><div style='display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center'><div class='clock'><div class='time' id='clock'>--:--</div></div></div></div><div class='grid' id='grid'></div><div class='soundbar'><button class='soundbtn' id='soundbtn'>Enable sound</button></div></div>
<div class='future' id='future'><div class='futuretop'><h1>Future meetings</h1><div class='futureactions'><button id='futureclose'>Back</button><button class='futureadd' id='futureadd'>+ Add meeting</button></div></div><div id='futurelist'></div></div><div class='modal' id='modal'><div class='card'><h2 id='formtitle'>Add meeting</h2><div class='field' id='datefield' style='display:none'><label>Date</label><input id='mdate' type='date'></div><div class='field'><label>Meeting name</label><input id='name' autocomplete='off' placeholder='e.g. 1-2-1'></div><div class='field'><label>Time</label><input id='mtime' type='time'></div><div class='actions'><button id='cancel'>Cancel</button><button class='save' id='save'>Save</button></div><button class='delete' id='delete' style='display:none'>Delete meeting</button></div></div>
<div class='alarm' id='alarm'><div><div class='big'>MEETING IN 5 MINUTES</div><h1 id='alarmname'></h1><div id='alarmtime'></div><button id='dismiss'>Dismiss</button></div></div>
<script>
(function(){
var days=['Tuesday','Wednesday','Thursday','Friday'],offset=0,selectedDate='',editId=null,alerted={},audioCtx=null,soundOn=false,jingleTimer=null,keepAlive=null,alarmGain=null;
function pad(n){return ('0'+n).slice(-2)} function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function monday(base){var d=new Date(base.getFullYear(),base.getMonth(),base.getDate()),x=d.getDay(),diff=(x===0?-6:1-x);d.setDate(d.getDate()+diff+offset*7);return d}
function load(){try{return JSON.parse(localStorage.getItem('deskMeetings')||'[]')}catch(e){return []}} function store(a){localStorage.setItem('deskMeetings',JSON.stringify(a))}
function fmtDate(d){return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]}
function byClass(el,c){while(el&&el!==document){if((' '+el.className+' ').indexOf(' '+c+' ')>-1)return el;el=el.parentNode}return null}
function render(){var m=monday(new Date()),now=new Date(),grid=document.getElementById('grid'),end=new Date(m),all=load();grid.innerHTML='';end.setDate(m.getDate()+4);document.getElementById('weektitle').innerHTML=offset===0?'This week':fmtDate(new Date(m.getFullYear(),m.getMonth(),m.getDate()+1))+' — '+fmtDate(end);
for(var i=0;i<4;i++){var d=new Date(m);d.setDate(m.getDate()+i+1);var k=key(d),box=document.createElement('div');box.className='day'+(k===key(now)?' today':'');box.innerHTML="<div class='dayhead'><div class='dow'>"+days[i]+"</div><div class='dnum'>"+d.getDate()+"</div></div><div class='events'></div><button class='add' data-date='"+k+"'>+</button>";var ev=[],j;for(j=0;j<all.length;j++)if(all[j].date===k)ev.push(all[j]);ev.sort(function(a,b){return a.time<b.time?-1:a.time>b.time?1:0});var cont=box.getElementsByClassName('events')[0];for(j=0;j<ev.length;j++){var e=ev[j],p=e.time.split(':'),dt=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+p[0],+p[1]),el=document.createElement('div');el.className='event'+(dt<now?' past':'');el.setAttribute('data-id',e.id);var mins=(+p[0])*60+(+p[1]),workStart=8*60,workEnd=16*60,pos=(mins-workStart)/(workEnd-workStart);if(pos<0)pos=0;if(pos>1)pos=1;var naturalTop=pos*88,last=cont.lastChild,top=naturalTop;if(last){var lastTop=parseFloat(last.getAttribute('data-top')||'0');if(top<lastTop+8)top=lastTop+8}if(top>88)top=88;el.setAttribute('data-top',top);el.style.top='calc('+(top)+'% + 2px)';el.innerHTML="<div class='ename'></div>";el.getElementsByClassName('ename')[0].appendChild(document.createTextNode(e.time+'  '+e.name));cont.appendChild(el)}grid.appendChild(box)}}
function openForm(date,id,showDate){selectedDate=date;editId=id||null;var all=load(),e=null,i;if(id)for(i=0;i<all.length;i++)if(all[i].id===id)e=all[i];document.getElementById('formtitle').innerHTML=e?'Edit meeting':'Add meeting';document.getElementById('datefield').style.display=showDate?'block':'none';document.getElementById('mdate').value=e?e.date:(date||key(new Date()));document.getElementById('name').value=e?e.name:'';document.getElementById('mtime').value=e?e.time:'';document.getElementById('delete').style.display=e?'block':'none';document.getElementById('modal').className='modal show'}
function close(){document.getElementById('modal').className='modal'}
document.getElementById('grid').onclick=function(evt){var a=byClass(evt.target,'add'),ev=byClass(evt.target,'event');if(a)openForm(a.getAttribute('data-date'));else if(ev){var box=byClass(ev,'day'),kids=document.getElementById('grid').children,idx=0,i;for(i=0;i<kids.length;i++)if(kids[i]===box)idx=i;var m=monday(new Date()),d=new Date(m);d.setDate(m.getDate()+idx+1);openForm(key(d),ev.getAttribute('data-id'))}}
document.getElementById('save').onclick=function(){var n=document.getElementById('name').value.replace(/^\s+|\s+$/g,''),t=document.getElementById('mtime').value,df=document.getElementById('datefield'),chosen=df.style.display==='block'?document.getElementById('mdate').value:selectedDate;if(!n||!t)return;var a=load(),i;if(!chosen)return;if(editId){for(i=0;i<a.length;i++)if(a[i].id===editId){a[i].name=n;a[i].time=t;a[i].date=chosen}}else a.push({id:String(new Date().getTime()),date:chosen,time:t,name:n});store(a);close();render();if(document.getElementById('future').className.indexOf('show')>-1)renderFuture()};
function renderFuture(){var a=load(),n=new Date(),today=key(n),out=[],i,list=document.getElementById('futurelist');for(i=0;i<a.length;i++)if(a[i].date>=today)out.push(a[i]);out.sort(function(x,y){var xa=x.date+' '+x.time,ya=y.date+' '+y.time;return xa<ya?-1:xa>ya?1:0});list.innerHTML='';if(!out.length){list.innerHTML="<div class='emptyfuture'>No future meetings</div>";return}for(i=0;i<out.length;i++){var e=out[i],q=e.date.split('-'),d=new Date(+q[0],+q[1]-1,+q[2]),el=document.createElement('div');el.className='futureitem';el.setAttribute('data-id',e.id);el.innerHTML="<div class='futurewhen'></div><div class='futurename'></div>";el.getElementsByClassName('futurewhen')[0].appendChild(document.createTextNode(days[(d.getDay()+5)%7]||['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]+' '+d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' · '+e.time));el.getElementsByClassName('futurename')[0].appendChild(document.createTextNode(e.name));list.appendChild(el)}}document.getElementById('listbtn').onclick=function(){renderFuture();document.getElementById('future').className='future show'};document.getElementById('futureclose').onclick=function(){document.getElementById('future').className='future'};document.getElementById('futureadd').onclick=function(){openForm(key(new Date()),null,true)};document.getElementById('futurelist').onclick=function(evt){var el=byClass(evt.target,'futureitem');if(el)openForm('',el.getAttribute('data-id'),true)};document.getElementById('delete').onclick=function(){var a=load(),b=[],i;for(i=0;i<a.length;i++)if(a[i].id!==editId)b.push(a[i]);store(b);close();render();if(document.getElementById('future').className.indexOf('show')>-1)renderFuture()};document.getElementById('cancel').onclick=close;document.getElementById('prev').onclick=function(){offset--;render()};document.getElementById('next').onclick=function(){offset++;render()};
function tone(freq,start,duration){if(!audioCtx)return;try{if(!alarmGain){alarmGain=audioCtx.createGain();alarmGain.gain.value=1;alarmGain.connect(audioCtx.destination)}var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(alarmGain);o.frequency.value=freq;g.gain.value=.22;o.start(audioCtx.currentTime+start);o.stop(audioCtx.currentTime+start+duration)}catch(e){}}
function jingle(){if(!soundOn||!audioCtx)return;try{if(audioCtx.resume)audioCtx.resume();if(alarmGain)alarmGain.gain.value=1;var sets=[0,5,10,15],i,s;for(s=0;s<sets.length;s++){i=sets[s];tone(523.25,i,.16);tone(659.25,i+.16,.20);tone(783.99,i+.34,.55);tone(659.25,i+1.05,.14);tone(783.99,i+1.20,.48)}}catch(e){}}
function startJingle(){stopJingle();jingle();jingleTimer=setInterval(jingle,20000)}
function stopJingle(){if(jingleTimer){clearInterval(jingleTimer);jingleTimer=null}if(alarmGain){try{alarmGain.gain.value=0}catch(e){}}}
function enableSound(){try{var A=window.AudioContext||window.webkitAudioContext;if(!A){document.getElementById('soundbtn').innerHTML='Sound unavailable';return}if(!audioCtx)audioCtx=new A();if(audioCtx.resume)audioCtx.resume();if(!keepAlive){keepAlive=audioCtx.createOscillator();var kg=audioCtx.createGain();kg.gain.value=0.00001;keepAlive.connect(kg);kg.connect(audioCtx.destination);keepAlive.frequency.value=40;keepAlive.start(0)}soundOn=true;tone(660,0,.15);var b=document.getElementById('soundbtn');b.innerHTML='Sound on · tap to disable';b.className='soundbtn on'}catch(e){document.getElementById('soundbtn').innerHTML='Sound failed'}}function disableSound(){stopJingle();soundOn=false;var b=document.getElementById('soundbtn');b.innerHTML='Sound off · tap to enable';b.className='soundbtn'}
document.getElementById('soundbtn').onclick=function(){if(!soundOn)enableSound();else disableSound()};
function tick(){var n=new Date();document.getElementById('clock').innerHTML=pad(n.getHours())+':'+pad(n.getMinutes());var a=load(),i;for(i=0;i<a.length;i++){var p=a[i].time.split(':'),q=a[i].date.split('-'),dt=new Date(+q[0],+q[1]-1,+q[2],+p[0],+p[1]),diff=dt.getTime()-n.getTime(),ak=a[i].id+'-'+a[i].date;if(diff>0&&diff<=300000&&!alerted[ak]){alerted[ak]=1;document.getElementById('alarmname').innerHTML='';document.getElementById('alarmname').appendChild(document.createTextNode(a[i].name));document.getElementById('alarmtime').innerHTML=a[i].time;document.getElementById('alarm').className='alarm show';startJingle()}}}
document.getElementById('dismiss').onclick=function(){stopJingle();document.getElementById('alarm').className='alarm'};render();tick();setInterval(tick,10000);setInterval(render,60000);
})();
</script></body></html>
